packages:
  - 'packages/ext/*'
  - 'packages/shared/*'

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  node-pty: true
  protobufjs: true

# Supply-chain policy. Mirrors the rill ecosystem template; see
# REPO-STANDARDS.md STD-SUP-3, STD-SUP-4 and STD-SUP-5. Both policies are
# enforced against every lockfile entry on install, not only on resolution,
# because `trustLockfile` stays at its default of false.

# Minutes a version must have been on the registry before pnpm will install it,
# which is the window in which a compromised release is normally yanked. Set
# explicitly rather than inherited: pnpm 11 defaults this to 1440 and pnpm 10
# defaults it to off, so an inherited value would mean a different policy on
# each major. 1440 also matches the weekly dependabot cadence above a longer
# window would just defer every bump by an extra cycle.
minimumReleaseAge: 1440

# Both entries are excluded by name, never by exact version: a pin needs a hand
# edit every release and silently stops excluding the moment the next version
# lands. The two have different reasons, so they are stated separately rather
# than sharing one comment nobody can audit later.
minimumReleaseAgeExclude:
  # Lockstep. Every extension declares a peerDependency on @rcrsr/rill matching
  # by minor, so a rill minor bump and the extension bump that answers it have
  # to be installable the same day. A cooling-off window on the runtime would
  # hold the whole ecosystem back from its own coordinated release.
  - '@rcrsr/rill'
  # First-party, and not lockstep. @rcrsr/rill-dev floats independently of the
  # language version; it is excluded because it is published by this ecosystem
  # from rcrsr/rill via trusted publishing, so the window delays our own fix
  # without adding scrutiny anyone would actually apply.
  - '@rcrsr/rill-dev'

# Fail the install when a package's trust evidence weakens against an
# earlier-published version, for example a drop from a trusted publisher to
# provenance-only.
trustPolicy: no-downgrade

# dts-bundle-generator@9.5.1 (latest) consumes the classic TypeScript compiler
# API (ts.sys, ts.createProgram) which TypeScript 7's native compiler no
# longer ships. Pin dts-bundle-generator's own nested typescript resolution
# to the last classic-API release so it keeps working; the workspace-wide
# `typescript` devDependency stays on ^7.0.2 for typecheck/tsup.
overrides:
  'dts-bundle-generator>typescript': '6.0.3'

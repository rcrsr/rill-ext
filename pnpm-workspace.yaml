packages:
  - 'packages/ext/*'
  - 'packages/shared/*'
  - 'packages/apps/*'

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  node-pty: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@rcrsr/rill@0.20.0'
  # Quarantine buys reaction time to a compromised release of a package we do
  # not control. @rcrsr/rill-dev is published by this ecosystem from rcrsr/rill
  # via trusted publishing, so the window only delays our own fix without
  # adding scrutiny anyone would actually apply. Excluded by name, not by
  # version: it floats independently of the language version, so a pin would
  # need a hand edit every release. This is not the lockstep reason that
  # applies to @rcrsr/rill above.
  - '@rcrsr/rill-dev'

# dts-bundle-generator@9.5.1 (latest) consumes the classic TypeScript compiler
# API (ts.sys, ts.createProgram) which TypeScript 7's native compiler no
# longer ships. Pin dts-bundle-generator's own nested typescript resolution
# to the last classic-API release so it keeps working; the workspace-wide
# `typescript` devDependency stays on ^7.0.2 for typecheck/tsup.
overrides:
  'dts-bundle-generator>typescript': '6.0.3'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.js'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.cjs'
              - '**/*.mjs'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24', '25']

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm -r run check

      # Tree only: no --remote, no token. A pull request cannot change host
      # state, and GITHUB_TOKEN cannot read branch protection anyway, so the
      # flag would add an API round trip and decide nothing. Host settings are
      # checked with `pnpm check:standards --remote` from a maintainer's
      # authenticated shell.
      - name: Check repository standards conformance
        run: pnpm exec rill-check-standards

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Include the workflow name: a bare ref collides across workflows keyed on the
  # same ref, so one would cancel another's run. Never cancel on main — a push
  # there must leave a completed status behind, or the required contexts for
  # that commit never report and the branch deadlocks.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.js'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/*.sh'
              - '.nvmrc'
              - '.node-version'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24', '25']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root `check`, not `pnpm -r run check`. `-r` excludes the workspace
      # root, so every root-only script — check:format, check:deps,
      # check:versions, test:rules, check:standards — silently never ran here.
      # The root aggregate reaches all of them plus each package's typecheck.
      #
      # check:standards runs tree-only through this: no --remote, no token. A
      # pull request cannot change host state, and GITHUB_TOKEN cannot read
      # branch protection anyway, so the flag would add an API round trip and
      # decide nothing. Host settings are checked with
      # `pnpm check:standards --remote` from a maintainer's authenticated shell.
      #
      # This also reruns check:versions, check:format, check:deps, test:rules,
      # and check:standards on every matrix leg, even though none of them can
      # differ by Node version — they inspect source, config, and manifest
      # shape, not runtime behaviour. That duplication is deliberate: keeping
      # one script that contributors and CI both invoke is worth more than the
      # time saved by splitting the Node-sensitive checks (build, check:types,
      # test) out onto their own step.
      - name: Run checks
        run: pnpm run check

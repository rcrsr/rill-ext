name: Compatibility Check

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled runs carry refs/heads/main, so this never cancels in practice;
  # the ref guard is here so a workflow_dispatch on a branch supersedes itself.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @rcrsr/rill to latest compatible
        run: pnpm -r update @rcrsr/rill

      - name: Build all packages
        run: pnpm -r run build

      - name: Run tests
        run: pnpm -r run test

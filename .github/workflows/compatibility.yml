name: Compatibility Check

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled runs carry refs/heads/main, so this never cancels in practice;
  # the ref guard is here so a workflow_dispatch on a branch supersedes itself.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @rcrsr/rill to latest compatible
        run: pnpm -r update @rcrsr/rill

      - name: Build all packages
        run: pnpm -r run build

      - name: Run tests
        run: pnpm -r run test

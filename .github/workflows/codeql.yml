name: CodeQL

# Copied from the rill ecosystem template. See @rcrsr/rill-dev's REPO-STANDARDS.md STD-SUP-6.
#
# No path filtering, for the same reason as ci.yml: a skipped run reports no
# status, and this workflow is a candidate required context.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly, so a newly published CodeQL query reaches this repo without
    # waiting for the next commit. Monday 07:00 UTC, ahead of the dependabot run.
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # Never on main: this workflow runs on push to main and is a candidate
  # required context, so a cancelled run would leave that commit with a status
  # that never reports.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # security-and-quality over the default security-extended: these
          # extensions run with live credentials inside LLM-generated scripts,
          # where a correctness defect is a security defect.
          queries: security-and-quality

      # No build step. javascript-typescript uses CodeQL's `none` build mode,
      # which extracts from source directly. Running the build would only add
      # bundler output for CodeQL to re-analyze.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'

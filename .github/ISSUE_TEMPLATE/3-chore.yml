# Pre-sets the native Issue Type. Decision rule vs Feature: "would a host-script
# author notice it in a release note?" No -> Chore. Covers debt, refactors,
# shared-package internals, test suites, perf, dependency sweeps with no visible
# surface change. An issue ABOUT executing untrusted scripts safely is Security,
# not Chore. Taxonomy: .github/labeler.yml header.
name: Chore
description: 'Robustness work on existing machinery: debt, refactors, shared internals, tests, perf, dependency sweeps'
type: Chore
body:
  - type: textarea
    id: machinery
    attributes:
      label: What machinery, and what is wrong with it?
      description: The component involved (a provider extension, a shared package like ext-llm/ext-search, the build toolchain, a test suite) and the debt, fragility, or inefficiency.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why it matters
      description: 'What it costs today, or what it blocks (duplicated logic across extensions, flaky-test counts, blocked issues #N).'
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Supporting context
      description: >-
        Optional. Related issues (#N) and pointers to the relevant source. What
        to look at. Do not prescribe the fix: the codebase changes and a
        solution in the ticket ages.
    validations:
      required: false
  - type: dropdown
    id: areas
    attributes:
      label: Area(s)
      description: Which capability domain, becomes the area:* labels at triage.
      multiple: true
      options:
        - llm
        - vectordb
        - kv
        - fs
        - search
        - mcp
        - prompt
        - integrations
        - utils
        - shared
        - docs
        - dx
    validations:
      required: true

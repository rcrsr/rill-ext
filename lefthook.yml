pre-commit:
  # Piped so a failing step halts the rest. Without it lint still runs after
  # format has already failed, and the second failure buries the first.
  piped: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,yaml,yml}'
      # oxfmt's own ignorePatterns also cover the lockfile; without this
      # exclude a lockfile-only commit hands oxfmt an all-ignored input list
      # and it exits non-zero (REPO-STANDARDS.md STD-HOOK-5).
      exclude:
        - 'pnpm-lock.yaml'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      # Match the scope of the per-package `lint` scripts and CI `check:lint`,
      # which cover src/ and tests/ (REPO-STANDARDS.md STD-LINT-4).
      glob: '**/{src,tests}/**/*.{ts,tsx}'
      run: pnpm exec oxlint --config .oxlintrc.json --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm -r run typecheck
    test:
      run: pnpm -r run test
